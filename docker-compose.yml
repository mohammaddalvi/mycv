# Self-hosting: `docker compose up -d` then open http://localhost:3000/admin
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: website
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/website
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./uploads:/app/uploads
    # Pages are pre-rendered from the database, so the build runs once the database is up.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm start"
    depends_on:
      - db

volumes:
  pgdata:
  node_modules:
